<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>KromaDrop</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>

  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-top drag">
        <div class="traffic no-drag">
          <button class="tl tl-close" data-win="close" title="Fechar"><svg viewBox="0 0 10 10"><path d="M3 3l4 4M7 3L3 7"/></svg></button>
          <button class="tl tl-min" data-win="minimize" title="Minimizar"><svg viewBox="0 0 10 10"><path d="M2.5 5h5"/></svg></button>
          <button class="tl tl-max" data-win="maximize" title="Maximizar"><svg viewBox="0 0 10 10"><path d="M3 6.6V3h3.6M7 3.4V7H3.4"/></svg></button>
        </div>
      </div>

      <div class="brand">
        <img src="../../assets/icon.png" alt="" />
        <div>
          <strong>KromaDrop</strong>
          <span id="brand-device">—</span>
        </div>
      </div>

      <nav class="nav">
        <div class="nav-label">Arquivos</div>
        <button class="nav-item" data-view="recent">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
          <span>Recentes</span><em id="badge-recent"></em>
        </button>
        <button class="nav-item" data-view="send">
          <svg viewBox="0 0 24 24"><path d="M12 15.5V4M7.5 8.5 12 4l4.5 4.5"/><path d="M5 13.5v4A2.5 2.5 0 0 0 7.5 20h9a2.5 2.5 0 0 0 2.5-2.5v-4"/></svg>
          <span>Enviar</span><em id="badge-send"></em>
        </button>
        <div class="nav-label">Dispositivo</div>
        <button class="nav-item" data-view="connect">
          <svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1.2"/><rect x="14" y="4" width="6" height="6" rx="1.2"/><rect x="4" y="14" width="6" height="6" rx="1.2"/><path d="M14 14h2.5v2.5H14zM17.5 17.5H20V20h-2.5zM14 20h1M20 14v1"/></svg>
          <span>Conectar</span>
        </button>
        <button class="nav-item" data-view="settings">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
          <span>Ajustes</span>
        </button>
      </nav>

      <button class="status" id="status" data-view="connect">
        <span class="dot"></span>
        <span class="status-text"><b id="status-title">Iniciando…</b><small id="status-sub"></small></span>
      </button>
    </aside>

    <main class="content">
      <header class="toolbar drag">
        <div>
          <h1 id="view-title">Recentes</h1>
          <p id="view-sub"></p>
        </div>
        <div class="toolbar-actions no-drag" id="toolbar-actions"></div>
      </header>
      <div class="scroller" id="view"></div>
    </main>
  </div>

  <div class="drop-overlay" id="drop-overlay">
    <div class="drop-card">
      <div class="drop-rings"><i></i><i></i><i></i></div>
      <strong>Solte para compartilhar</strong>
      <span>Ficam disponíveis na hora para o iPhone, o Mac ou outro PC</span>
    </div>
  </div>

  <div class="toasts" id="toasts"></div>

  <script src="app.js"></script>
</body>
</html>
